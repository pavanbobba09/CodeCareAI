name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codecare
          POSTGRES_PASSWORD: codecare
          POSTGRES_DB: codecare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codecare -d codecare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codecare:codecare@localhost:5432/codecare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . ../scripts
      - run: ruff format --check . ../scripts
      - run: mypy app
      - run: pytest tests/unit
      - run: alembic upgrade head
      - run: pytest tests/integration
