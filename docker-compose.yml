services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codecare
      POSTGRES_PASSWORD: codecare
      POSTGRES_DB: codecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecare -d codecare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
